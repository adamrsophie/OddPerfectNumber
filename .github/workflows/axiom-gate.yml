name: Axiom gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A full rebuild from an empty build folder: once a week, and on request.
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
    inputs:
      clean:
        description: Rebuild everything from an empty build folder
        type: boolean
        default: true

# One run at a time for pushes and pull requests of a branch, so that each run restores the
# build its predecessor saved. A run in progress is never canceled; of the runs waiting behind
# it only the newest is kept. The weekly rebuild and manual runs are in groups of their own.
concurrency:
  group: axiom-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A build from an empty build folder takes more than two and a half hours on the hosted
    # runner; a run that restores an earlier build compiles only what changed.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs elan and the toolchain pinned in lean-toolchain and restores the
      # mathlib cache with lake exe cache get. The build runs in the timed step below.
      # The action's own cache of .lake is off: it is saved before the build step, so it
      # would hold only the mathlib files that lake exe cache get fetches anyway.
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          use-mathlib-cache: true
          use-github-cache: false
          build: false
          test: false
          lint: false

      - name: Toolchain version
        run: lean --version && lake --version

      # The compiled library of the most recent run that passed every step below. Lake
      # decides what to rebuild from content hashes of each source file and of what it
      # imports, so a restored module is reused only if nothing it depends on changed, and
      # the axiom gate below still inspects every constant of the whole library on every
      # run. The key contains the toolchain, the manifest and the lakefile, so a change to
      # any of them starts from an empty build folder. The weekly run and a manual run with
      # "clean" skip this step and rebuild everything. Only runs on the main branch save
      # the build (last step), so a pull request cannot change what later runs restore.
      - name: Restore the library build of an earlier run
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.clean) }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      # The Python checks below run before the long build so that a failure shows early. The
      # system Python of the runner is externally managed and has no sympy, so a virtual
      # environment outside the checkout gets exactly the pinned pure Python wheels of sympy and
      # mpmath listed with their SHA-256 hashes in scripts/Controls/requirements-sympy.txt (that
      # file says how to regenerate it); pip refuses any other file. The interpreter of the
      # environment still sees its own packages in isolated mode (-I).
      - name: Python environment with pinned sympy
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r scripts/Controls/requirements-sympy.txt
          "$RUNNER_TEMP/venv/bin/python" -I -c 'import sys, sympy, mpmath; print(sys.version, sympy.__version__, mpmath.__version__)'

      # Exit status controls of the published Python validators, all of them, including those of
      # scripts/CommonFamilies/verify.py, which needs sympy, and the controls of the helpers of
      # scripts/ThreeFreeThree (forged certificates, failure statuses, regeneration of the twelve
      # generated modules with a byte comparison), of the MixedIndex validators, of the source
      # scan and of the module list of the kernel replay (with a stand in for lake). The
      # validators run as subprocesses of the same interpreter.
      - name: Validator controls
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I scripts/Controls/validator_controls.py

      # Controls of the replay and generator helpers of scripts/DefectTree, scripts/ShapeSmall,
      # scripts/SpecialFive and scripts/SpecialFiveMore: every archived certificate must pass,
      # and each mutated input must be rejected with its expected exit status, in normal and in
      # optimized mode (about a minute).
      - name: Replay controls
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I scripts/Controls/replay_controls.py

      # Regenerates the 13 modules OddPerfect/CommonNinetyFive*.lean of the family of 95 from
      # the archived input and compares them byte for byte with the checkout (about ten
      # seconds). The script runs every step with the interpreter named by PYTHON.
      - name: Rebuild of the family of 95
        env:
          PYTHON: ${{ runner.temp }}/venv/bin/python
        run: bash scripts/CommonFamilies/rebuild95.sh . "$RUNNER_TEMP/rebuild95"

      # Regenerates the four generated modules of the five exception theorem with the
      # generator in scripts/FiveException and compares them byte for byte with the checkout
      # (a few seconds; the generator needs only the Python standard library).
      - name: Rebuild of the five exception data modules
        run: |
          mkdir "$RUNNER_TEMP/five"
          python3 -I scripts/FiveException/gen.py "$RUNNER_TEMP/five" > /dev/null
          for f in FiveExceptionData0 FiveExceptionData79 FiveExceptionDataT FiveExceptionScan; do
            cmp "$RUNNER_TEMP/five/$f.lean" "OddPerfect/$f.lean"
          done

      # Constructs in the library sources that AxiomGate.lean cannot see in the compiled
      # environment: debug options such as debug.skipKernelTC, commands that run code at
      # elaboration time, new syntax, notation or elaborators, local instances, set_option
      # outside the options the library uses, and Lean options in lakefile.toml (about a second).
      - name: Source scan
        run: python3 -I scripts/Controls/source_scan.py

      # Contributed proofs (Contributions/<Name>.lean, see CONTRIBUTING.md) are compiled outside
      # the library by the contribution gate below. This scan reads them first: it rejects what
      # could run a program during elaboration or make Lean skip the kernel. On a pull request
      # the change must add exactly one contributed file and touch nothing else; every other
      # change reaches the main branch through the maintainers' own pushes. A pull request can
      # edit this workflow, so a green run of a pull request is never the reason to accept it:
      # the maintainers repeat the scan and the gate on the file itself.
      - name: Contribution scan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            python3 -I scripts/Controls/contribution_scan.py --pull-request "origin/$BASE_REF"
          fi
          python3 -I scripts/Controls/contribution_scan.py

      - name: Build
        run: |
          start=$(date +%s)
          # One module at a time, in the order of the root file. A plain lake build
          # compiles independent modules at once; the runner was shut down during
          # builds that compiled several of the heaviest proofs together.
          for m in $(sed -n 's/^import \(OddPerfect\.[A-Za-z0-9_.]*\)$/\1/p' OddPerfect.lean); do
            lake build "$m"
          done
          lake build
          echo "lake build took $(( $(date +%s) - start )) s"

      # Source coverage input: the library files tracked in this checkout. The gate fails
      # if a tracked OddPerfect.lean or OddPerfect/**.lean is not imported, directly or
      # transitively, by OddPerfect.lean, and conversely. Under CI the gate refuses to run
      # without this list.
      - name: List tracked library sources
        run: |
          git ls-files -- OddPerfect.lean OddPerfect > "$RUNNER_TEMP/tracked-files.txt"
          wc -l < "$RUNNER_TEMP/tracked-files.txt"

      - name: Axiom gate and source coverage
        env:
          AXIOM_GATE_TRACKED_FILES: ${{ runner.temp }}/tracked-files.txt
        run: lake env lean AxiomGate.lean

      # Restates the headline theorems with mathlib's definitions and the project's OddPerfect
      # and proves each by reference to the library theorem; fails if a statement changed,
      # mentions a project definition outside the file's allowed list, or if the restatements
      # differ from the file's inventory of expected names (about 5 s).
      - name: Statement gate
        run: lake env lean StatementGate.lean

      # Compiling the gate as a module for the controls runs it on the library once more,
      # so this step needs the tracked file list too. The runner also compiles the statement
      # gate as a module, runs the source scan on its control and replays one control module
      # with leanchecker.
      - name: Gate controls
        env:
          AXIOM_GATE_TRACKED_FILES: ${{ runner.temp }}/tracked-files.txt
        run: sh GateControls/run.sh AxiomGate.lean StatementGate.lean

      # Values of the certificate checkers on tiny well formed and malformed inputs. The weekly
      # run also compiles the five generated checks of the largest prime factor search (about
      # 90 s CPU and 15 GB peak on the build server, as much as
      # OddPerfect/LargestPrimeFactor.lean itself); the other runs only count them.
      - name: Checker controls
        run: sh CheckerControls/run.sh ${{ github.event_name == 'schedule' && 'full' || '' }}

      # Compiles every contributed proof outside the library and checks the compiled result:
      # the theorem exists, its statement is exactly the posted step of OddPerfect/Steps.lean,
      # and every declaration of the file depends only on the three standard axioms. The
      # controls run the gate on forged contributions, each of which must be rejected.
      - name: Contribution gate
        run: |
          sh scripts/Controls/contribution_gate.sh
          sh scripts/Controls/contribution_gate.sh controls

      # Saved only after every step above passed, and never from a pull request.
      - name: Save the library build
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}-${{ github.run_id }}
